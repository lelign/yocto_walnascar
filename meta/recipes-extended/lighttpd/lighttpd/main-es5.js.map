<app-view [data]='wsData.sidebarRoutes' [modelStr]='wsData.modelStr'>
    <app-panel title='Slave mode' [hidden]='wsData.settingsData.cascade_mode!==5'>
        Device in slave mode.
    </app-panel>
    <app-panel title='Controls' [hidden]='wsData.settingsData.cascade_mode===5'>
        <app-fieldbody title='Live Stream' [hidden]='(wsData.settingsData.model===0)||(wsData.settingsData.model===2)'>
            <a href="#/stream" class="btn button-default btn-fixed-width" target="_blank">Start</a>
        </app-fieldbody>
        <app-fieldbody title='Fullscreen'>
            <app-soloselect (changed)='soloOnChange($event)'
                    [data]='settingsData.sdi_label'
                    [enable]='settingsData.solo.enable'
                    [input]='settingsData.solo.input'
                >
                </app-soloselect>
        </app-fieldbody>
        <app-presetselect
            [data]='wsData.layoutData.presets'
            [presetIndex]='wsData.layoutData.presetIndex'
            (changed)='presetChanged($event)'>
        </app-presetselect>
    </app-panel>
    <app-panel title='Inputs Format' [hidden]='wsData.settingsData.cascade_mode===5'>
            <app-inputfield *ngFor="let input of diagnosticsData.sdi_format; let i = index"
                                readonly
                                title='Input {{wsData.getInputNumberString(i)}}'
                                [(ngModel)]='diagnosticsData.sdi_format[i]'
                                [hidden]='wsData.getInputSkip(i)'
                                name='input_{{i + 1}}'>
            </app-inputfield>
    </app-panel>
</app-view>
