<div class="btn-group d-flex" role="group">
  <button type="button" class="btn solobutton"
    [ngClass]="{'active': enable}"
    (click)='soloClick()'
  >Solo</button>

  <div class="btn-group w-100" role="group">
    <button id="btnGroupDrop1" type="button" class="sololist btn dropdown-toggle w-100 text-end" data-bs-toggle="dropdown"
      aria-haspopup="true" aria-expanded="false">
      {{data[input]|slice:0:17}}
    </button>
    <div class="dropdown-menu" aria-labelledby="btnGroupDrop1">
        <ng-container *ngFor="let d of data; let i = index">
            <a class="dropdown-item" href="#" *ngIf="!wsData.getInputSkip(i)" (click)='btnClick(i)'>{{wsData.getInputNumberString(i)}}. {{d}}</a>
        </ng-container>
    </div>
  </div>
</div>
