<app-view [data]='wsData.sidebarRoutes' [modelStr]='wsData.modelStr'>
    <app-panel title='Slave mode' [hidden]='wsData.settingsData.cascade_mode!==5'>
        Device in slave mode.
    </app-panel>
    <app-panel title='Inputs Label' [hidden]='wsData.settingsData.cascade_mode===5'>
        <form #settingsForm="ngForm">
        <app-inputfield *ngFor="let v of settingsData.sdi_label; let i = index; trackBy:indexTracker"
                            title='Input {{wsData.getInputNumberString(i)}}'
                            [(ngModel)]='settingsData.sdi_label[i]'
                            [hidden]='wsData.getInputSkip(i)'
                            name='input_{{i + 1}}'>
        </app-inputfield>
        <app-setcancelbutton (apply)='sendForm()' (cancel)="resetForm()" [disabled]="settingsForm.pristine"></app-setcancelbutton>
        </form>
    </app-panel>
    <app-panel title='Audio Alarm Settings' [hidden]='wsData.settingsData.cascade_mode===5'>
        <form #alarmSettingsForm="ngForm">
            <app-inputfield
                title='Mimimum Level, dBFS' nocase
                type='number'
                [(ngModel)]='settingsData.alarm_settings.audio.minimum_level'
                name='minumumLevel'>
            </app-inputfield>
            <app-inputfield
                title='Threshold, ms' nocase
                type='number'
                [(ngModel)]='settingsData.alarm_settings.audio.threshold'
                name='threshold'>
            </app-inputfield>
            <app-panelhr title="Video Alarm Settings"></app-panelhr>
            <app-inputfield
                title='Threshold, ms' nocase
                type='number'
                [(ngModel)]='settingsData.alarm_settings.video.threshold'
                name='threshold'>
            </app-inputfield>
            <app-panelhr title="Video Output Settings"></app-panelhr>
            <app-selectfield title='Output Format'
                [(ngModel)]="settingsData.output_format" name="outputFormat">
                <option [value]="0">2160p50</option>
                <option [value]="1">2160p25</option>
                <option [value]="1">1080p50</option>
                <option [value]="1">1080i25</option>
            </app-selectfield>
            <app-selectfield title='HDMI Colorspace' nocase
                [(ngModel)]="settingsData.hdmi_color" name="hdmi_color">
                <option [value]="0">YCbCr</option>
                <option [value]="1">RGB</option>
            </app-selectfield>
            <app-panelhr title="GPIO Settings" nocase></app-panelhr>
            <app-selectfield title='GPIO Mode' nocase
                [(ngModel)]="settingsData.gpio_mode" name="gpioMode">
                <option [value]="0">Solo</option>
                <option [value]="1">Tally</option>
                <option [value]="2">Preset</option>
            </app-selectfield>
            <app-panelhr title="Teletext Settings"></app-panelhr>
            <app-selectfield title='Display'
                [(ngModel)]="settingsData.layout.teletext_enable" name="teletextEnable">
                <option [value]="0">Disabled</option>
                <option [value]="1">Enabled</option>
            </app-selectfield>
            <app-inputfield
                title='Page Number'
                type='number'
                [(ngModel)]='settingsData.layout.teletext_page'
                name='teletextPage'>
            </app-inputfield>
            <app-setcancelbutton (apply)='sendForm()' (cancel)="resetForm()" [disabled]="alarmSettingsForm.pristine"></app-setcancelbutton>
        </form>
    </app-panel>
</app-view>
