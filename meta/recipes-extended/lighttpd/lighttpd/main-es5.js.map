<app-view [data]='wsData.sidebarRoutes' [modelStr]='wsData.modelStr'>
    <app-panel title='Cell parameters'>
        <form #settingsForm="ngForm">
        <app-selectfield title='Input' [(ngModel)]="input" name="type">
            <ng-container *ngFor="let item of wsData.settingsData.sdi_label; let i = index">
                <option *ngIf="!wsData.getInputSkip(i)" value="{{i}}">{{wsData.getInputNumberString(i)}}. {{item}}</option>
            </ng-container>
        </app-selectfield>
        <app-selectfield title='Cell Style' [(ngModel)]="cellStyle" name="cellStyle">
            <option [value]="0">A</option>
            <option [value]="1">B</option>
        </app-selectfield>
        <app-selectfield title='Audio Bars' [(ngModel)]="bars" name="bars">
            <option [value]="0">Off</option>
            <option [value]="1">Single</option>
            <option [value]="2">Dual</option>
        </app-selectfield>
        <app-selectfield title='SD Aspect Ratio' nocase [(ngModel)]="aspectRatioSd" name="aspectRatioSd">
            <option [value]="0">4:3</option>
            <option [value]="1">16:9</option>
        </app-selectfield>
        <app-selectfield title='SDI Format' nocase [(ngModel)]="sdiFormatEnable" name="sdiFormatEnable">
            <option [value]="0">Disable</option>
            <option [value]="1">Enable</option>
        </app-selectfield>
        <app-panelhr title='Alarms'></app-panelhr>
        <app-selectfield title='Audio Silence' [(ngModel)]="audioAlarm" name="audioAlarm">
            <option [value]="0">Disabled</option>
            <option [value]="1">Enabled</option>
        </app-selectfield>
        <app-fieldbody title='Audio Channels'>
            <app-checkbox title="1" name="audio1" [(ngModel)]="audioAlarmChannel[0]"></app-checkbox>
            <app-checkbox title="2" name="audio2" [(ngModel)]="audioAlarmChannel[1]"></app-checkbox>
            <app-checkbox title="3" name="audio3" [(ngModel)]="audioAlarmChannel[2]"></app-checkbox>
            <app-checkbox title="4" name="audio4" [(ngModel)]="audioAlarmChannel[3]"></app-checkbox>
      </app-fieldbody>
        <app-selectfield title='Video Freeze' [(ngModel)]="videoFreeze" name="videoFreeze">
            <option [value]="0">Disabled</option>
            <option [value]="1">Enabled</option>
        </app-selectfield>
        <app-panelhr title='Display Info'></app-panelhr>
        <app-selectfield title='SCTE-104' nocase [(ngModel)]="scte104Display" name="scte104Display">
            <option [value]="0">Disabled</option>
            <option [value]="1">Enabled</option>
        </app-selectfield>
        <app-selectfield title='Label Text' [(ngModel)]="umdDisplay" name="umdDisplay">
            <option [value]="0">Static</option>
            <option [value]="1">UMD</option>
            <option [value]="2">Static & UMD</option>
        </app-selectfield>
        <app-setcancelbutton (apply)='dataApply()' (cancel)="dataCancel()"></app-setcancelbutton>
    </form>
    </app-panel>
</app-view>
