<form #systemForm="ngForm"><app-view [data]='wsData.sidebarRoutes' [modelStr]='wsData.modelStr'>
    <app-panel title='Configuration'>
        <app-inputfield
            title='DNS Server' nocase
            [(ngModel)]='systemData.dns'
            name='dnsServer'>
        </app-inputfield>
        <app-inputfield
            title='NTP Server' nocase
            [(ngModel)]='systemData.ntp'
            name='ntpServer'>
        </app-inputfield>
        <app-timezone title='Time Zone'
            [(ngModel)]='systemData.time_zone'
            name='timeZone'>
        </app-timezone>
        <app-panelhr title="Cascading Settings"></app-panelhr>
        <app-selectfield title='Cascade Mode'
            [(ngModel)]="systemData.cascade_mode" name="cascade_mode">
            <option [value]="0">Standalone</option>
            <option [value]="1">Cascade 2</option>
            <option [value]="2">Cascade 3</option>
            <option [value]="3">Cascade 4</option>
            <option [value]="4">Cascade 5</option>
            <option [value]="5">Slave</option>
        </app-selectfield>
        <app-inputfield
            title='Module 2 IP' nocase
            [(ngModel)]='systemData.ip_2'
            [disabled]='(systemData.cascade_mode<1)||(systemData.cascade_mode==5)'
            name='module_2_ip'>
        </app-inputfield>
        <app-inputfield
            title='Module 3 IP' nocase
            [(ngModel)]='systemData.ip_3'
            [disabled]='(systemData.cascade_mode<2)||(systemData.cascade_mode==5)'
            name='module_3_ip'>
        </app-inputfield>
        <app-inputfield
            title='Module 4 IP' nocase
            [(ngModel)]='systemData.ip_4'
            [disabled]='(systemData.cascade_mode<3)||(systemData.cascade_mode==5)'
            name='module_4_ip'>
        </app-inputfield>
        <app-inputfield
            title='Module 5 IP' nocase
            [(ngModel)]='systemData.ip_5'
            [disabled]='(systemData.cascade_mode<4)||(systemData.cascade_mode==5)'
            name='module_5_ip'>
        </app-inputfield>
        <app-setcancelbutton (apply)='sendForm()' (cancel)="resetForm()" [disabled]="systemForm.pristine"></app-setcancelbutton>
    </app-panel>

    <app-panel title='Diagnostics'>
        <app-inputfield
            title='Power, W'
            readonly
            [(ngModel)]='diagnosticsData.diagnostics.power_W'
            name='power_W'>
        </app-inputfield>

        <app-inputfield
            title='Temperature, °C'
            readonly
            [(ngModel)]='diagnosticsData.diagnostics.temperature_C'
            name='temperature_C'>
        </app-inputfield>

        <app-inputfield
            title='Fan Status'
            readonly
            [(ngModel)]='diagnosticsData.diagnostics.fan'
            [hidden]='(wsData.settingsData.model===2)||(wsData.settingsData.model===3)'
            name='fan'>
        </app-inputfield>

        <app-inputfield
            title='Uptime'
            readonly
            [(ngModel)]='diagnosticsData.diagnostics.uptime'
            name='uptime'>
        </app-inputfield>

        <app-inputfield
            title='System Time'
            readonly
            [(ngModel)]='wsData.sysDateTime'
            name='sysDateTime'>
        </app-inputfield>

        <app-fieldbody title='Event Log'>
            <button class="btn button-default btn-fixed-width" type="button" (click)='EventLogOpen()'>Open</button>
        </app-fieldbody>

        <app-panelhr title="Other"></app-panelhr>

        <app-modal
            title='Time'
            name='setfrompc'
            button='From PC'
            (ok)='SetTime()'
        >
            Set system time from PC?
        </app-modal>

        <app-fieldbody title='Layout Preset' [hidden]='systemData.cascade_mode==5'>
            <button class="btn button-default btn-fixed-width" type="button" (click)='ConfigExport()'>Save</button>
            <button class="btn button-default btn-fixed-width" type="button" (click)='ConfigImport()'>Load</button>
            <a id="downloadAnchorElem" style="display:none"></a>
            <input type="file" id="jsonFile" name="jsonFile" accept=".json" (change)='ConfigRead($event)' style="display:none"/>
        </app-fieldbody>

        <app-modal
            title='System'
            name='reboot'
            button='Reboot'
            (ok)='reboot()'
        >
            Reboot?
        </app-modal>

    </app-panel>

    <app-panel title='Network Settings'>
        <app-inputfield
            nocase
            [(ngModel)]='networkSettings.ip'
            title='IP Address'
            name='eth0_ip'>
        </app-inputfield>

        <app-inputfield
            title='Netmask'
            [(ngModel)]='networkSettings.mask'
            name='eth0_mask'>
        </app-inputfield>

        <app-inputfield
            title='Gateway'
            [(ngModel)]='networkSettings.gateway'
            name='eth0_gateway'>
        </app-inputfield>

        <app-inputfield
            title='MAC'
            readonly
            nocase
            [(ngModel)]='networkSettings.mac'
            name='eth0_mac'>
        </app-inputfield>

        <app-setcancelbutton
            (apply)='sendIpForm()'
            (cancel)="resetForm()"
            [disabled]="systemForm.pristine">
        </app-setcancelbutton>
    </app-panel>

    <app-panel title='Version Information'>
        <app-inputfield
                title='Version'
                readonly
                [(ngModel)]='diagnosticsData.system.version_software'
                name='version_software'>
        </app-inputfield>

        <app-inputfield
                title='Build ID' nocase
                readonly
                [(ngModel)]='diagnosticsData.system.build_id'
                name='build_id'>
        </app-inputfield>

        <app-inputfield
                title='Frontend Version'
                readonly
                [(ngModel)]='wsData.version.frontend_version'
                name='frontend_version'>
        </app-inputfield>
    </app-panel>

    <app-panel title='Change Password'>
        <app-inputfield title='New Password' type='password' [ngModelOptions]="{standalone: true}" [(ngModel)]='codeword'></app-inputfield>

        <app-inputfield title='Confirm Password' type='password' [ngModelOptions]="{standalone: true}" [(ngModel)]='confirmCodeword'></app-inputfield>

        <app-fieldbody title=''>
            <button class="btn button-default btn-fixed-width" type="button" (click)='setNewCodeword(codeword)' [disabled]="(codeword!==confirmCodeword)">Set</button>
        </app-fieldbody>
    </app-panel>

</app-view></form>
