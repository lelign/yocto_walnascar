<app-fieldbody title='Layout Preset'>
    <div class="btn-group d-flex" role="group">
        <div class="btn-group w-100" role="group">
            <button id="btnGroupDrop1" type="button" class="btn presetselect dropdown-toggle w-100 text-end" data-bs-toggle="dropdown"
                aria-haspopup="true" aria-expanded="false">
                {{data[presetIndex]|slice:0:25}}
            </button>
            <div class="dropdown-menu" aria-labelledby="btnGroupDrop1">
                    <a class="dropdown-item" href="#" *ngFor="let d of data; let i = index" (click)='lineClick($event, i)'>{{d}}</a>
            </div>
        </div>
    </div>
</app-fieldbody>
