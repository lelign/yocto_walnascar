<form #layoutForm="ngForm">
    <app-view [data]='wsData.sidebarRoutes' [modelStr]='wsData.modelStr'>
        <app-panel title='Slave mode' [hidden]='wsData.settingsData.cascade_mode!==5'>
            Device in slave mode.
        </app-panel>
        <app-panel title='Layout editor' [hidden]='wsData.settingsData.cascade_mode===5'
            class='col-xxl-10 col-xl-11 col-lg-12 col-md-12 col-sm-12 col-xs-12 mb-2 mb-2 layoutpanel'
        >

            <app-presetselect
                [data]='wsData.layoutData.presets'
                [presetIndex]='wsData.layoutData.presetIndex'
                (changed)='presetChanged($event)'>
            </app-presetselect>

            <app-inputfield
                title='Name'
                [(ngModel)]='wsData.layoutData.presets[wsData.layoutData.presetIndex]'
                (ngModelChange)='wsData.layoutData.dirty=1'
                name='layoutName'>
            </app-inputfield>

            <app-buttongroup
                title='Grid'
                [buttons]='["3x3", "4x4", "5x5", "6x6", "12x12"]'
                [(ngModel)]='grid'
                name='grid'
                (ngModelChange)='setGrid(grid)'>
            </app-buttongroup>

            <app-buttongroup
                title='Add New'
                [buttons]='["Video", "Clock", "Timer", "Label"]'
                name='addtype'
                [(ngModel)]='addType'>
            </app-buttongroup>

            <div class="form-group row">
                <app-layouteditor
                    class="col-md-12"
                    [data]='wsData.layoutData'
                    [addType]='addType'
                    (changed)='newWindow($event)'
                    (remove)='removeWindow($event)'
                ></app-layouteditor>
            </div>

            <app-setcancelbutton (apply)='dataApply()' (cancel)="dataCancel()" [disabled]="wsData.layoutData.dirty === 0"></app-setcancelbutton>

        </app-panel>
    </app-view>
</form>
