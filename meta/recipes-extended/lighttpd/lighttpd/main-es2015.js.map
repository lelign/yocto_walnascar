<app-view [data]='wsData.sidebarRoutes' [modelStr]='wsData.modelStr'>
    <app-panel title='Clock settings'>
    <form #settingsForm="ngForm">
        <app-inputfield
            title='Label'
            [(ngModel)]='clockLabel'
            name='label'>
        </app-inputfield>

        <app-selectfield title='Style' [(ngModel)]="clockStyle" name="clockStyle">
            <option [value]="0">Analog</option>
            <option [value]="1">Digital</option>
        </app-selectfield>

        <app-selectfield title='Date Text' [(ngModel)]="dateLocale" [disabled]='clockStyle===0' name="dateLocale">
            <option [value]="0">English</option>
            <option [value]="1">Russian</option>
        </app-selectfield>

        <app-setcancelbutton (apply)='dataApply()' (cancel)="dataCancel()"></app-setcancelbutton>
    </form>
    </app-panel>
</app-view>
